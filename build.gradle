plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.neotv.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neotv.launcher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }
}
